Meiryo',sans-serif" font-size="13.5" fill="#c9372c" text-anchor="start" font-weight="700">⚠ ファームウェア書き込み時は HC-06 の TXD / RXD を必ず抜く</text><text x="40.0" y="472.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="400">D0 / D1 は USB 書き込みと同じハードウェアシリアル。挿したままだと書き込みに失敗する。</text><text x="40.0" y="490.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="400">TXD→D0 / RXD→D1 のクロス接続。同じ名前どうしを繋ぐと通信できない。</text><text x="40.0" y="528.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="start" font-weight="400">サーボの 3 極は S（信号・橙）/ V（+・赤）/ G（GND・茶）。逆挿しするとサーボが発熱する。</text></svg>
