<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img"><title>5 節平行リンクの寸法</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9372c"/></marker></defs><rect width="760" height="500" fill="#ffffff"/><text x="24.0" y="34.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="700">5 節平行リンク機構と寸法</text><text x="24.0" y="56.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6a737d" text-anchor="start" font-weight="400">ファームウェアの baselen / arm1len / arm2len に対応する実寸</text><rect x="215.0" y="372.0" width="329.0" height="12.0" rx="3" fill="#3a3f45" stroke="#1f2328" stroke-width="1.4"/><line x1="285.0" y1="360.0" x2="408.1" y2="333.2" stroke="#9aa5b1" stroke-width="11" stroke-linecap="round"/><line x1="285.0" y1="360.0" x2="408.1" y2="333.2" stroke="#d7dde5" stroke-width="7" stroke-linecap="round"/><line x1="474.0" y1="360.0" x2="350.9" y2="333.2" stroke="#9aa5b1" stroke-width="11" stroke-linecap="round"/><line x1="474.0" y1="360.0" x2="350.9" y2="333.2" stroke="#d7dde5" stroke-width="7" stroke-linecap="round"/><line x1="408.1" y1="333.2" x2="379.5" y2="82.8" stroke="#9aa5b1" stroke-width="11" stroke-linecap="round"/><line x1="408.1" y1="333.2" x2="379.5" y2="82.8" stroke="#d7dde5" stroke-width="7" stroke-linecap="round"/><line x1="350.9" y1="333.2" x2="379.5" y2="82.8" stroke="#9aa5b1" stroke-width="11" stroke-linecap="round"/><line x1="350.9" y1="333.2" x2="379.5" y2="82.8" stroke="#d7dde5" stroke-width="7" stroke-linecap="round"/><circle cx="408.1" cy="333.2" r="6.5" fill="#ffffff" stroke="#1f2328" stroke-width="2.2"/><circle cx="408.1" cy="333.2" r="2.2" fill="#1f2328" stroke="none" stroke-width="0"/><circle cx="350.9" cy="333.2" r="6.5" fill="#ffffff" stroke="#1f2328" stroke-width="2.2"/><circle cx="350.9" cy="333.2" r="2.2" fill="#1f2328" stroke="none" stroke-width="0"/><circle cx="285.0" cy="360.0" r="7.5" fill="#ffffff" stroke="#c9372c" stroke-width="2.6"/><circle cx="285.0" cy="360.0" r="2.6" fill="#c9372c" stroke="none" stroke-width="0"/><circle cx="474.0" cy="360.0" r="7.5" fill="#ffffff" stroke="#c9372c" stroke-width="2.6"/><circle cx="474.0" cy="360.0" r="2.6" fill="#c9372c" stroke="none" stroke-width="0"/><circle cx="379.5" cy="82.8" r="8.0" fill="#ffffff" stroke="#1a7f37" stroke-width="2.6"/><line x1="379.5" y1="82.8" x2="379.5" y2="34.8" stroke="#1a7f37" stroke-width="3" stroke-linecap="round"/><text x="392.5" y="48.8" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#1a7f37" text-anchor="start" font-weight="700">ペン先</text><line x1="285.0" y1="370.0" x2="285.0" y2="400.0" stroke="#c9372c" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 3"/><text x="285.0" y="416.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#c9372c" text-anchor="middle" font-weight="700">肩 B</text><text x="285.0" y="432.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">D10</text><line x1="474.0" y1="370.0" x2="474.0" y2="400.0" stroke="#c9372c" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 3"/><text x="474.0" y="416.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="13" fill="#c9372c" text-anchor="middle" font-weight="700">肩 C</text><text x="474.0" y="432.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">D11</text><line x1="285.0" y1="458.0" x2="474.0" y2="458.0" stroke="#6a737d" stroke-width="1.0" stroke-linecap="round"/><line x1="285.0" y1="454.0" x2="285.0" y2="462.0" stroke="#6a737d" stroke-width="1.0" stroke-linecap="round"/><line x1="474.0" y1="454.0" x2="474.0" y2="462.0" stroke="#6a737d" stroke-width="1.0" stroke-linecap="round"/><text x="379.5" y="452.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">肩間 baselen = 45 mm</text><path d="M150.0,300.0 L346.6,352.6" fill="none" stroke="#6a737d" stroke-width="1.3" marker-end="url(#ah)"/><text x="150.0" y="295.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6a737d" text-anchor="middle" font-weight="600">上腕 arm1len = 30 mm</text><path d="M600.0,210.0 L399.8,208.0" fill="none" stroke="#6a737d" stroke-width="1.3" marker-end="url(#ah)"/><text x="600.0" y="205.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6a737d" text-anchor="middle" font-weight="600">前腕 arm2len = 60 mm</text><text x="24.0" y="76.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="start" font-weight="400">※ 左右の上腕は内側を向いて交差する形になる</text><text x="24.0" y="480.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="start" font-weight="400">寸法は穴の中心間距離。実測とずれる場合は Drawing.ino の同名の定数を書き換えて校正する。</text></svg>
