172.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">sely = Y / 50 + 3.0</text><text x="514.0" y="196.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">1 単位 = 1/50 cm = 0.2 mm</text></svg>
