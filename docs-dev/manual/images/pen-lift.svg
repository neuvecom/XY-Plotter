t-weight="700">サーボ A（D9）</text><line x1="436.0" y1="214.0" x2="480.0" y2="178.0" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round"/><text x="497.0" y="246.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="10" fill="#6a737d" text-anchor="middle" font-weight="400">回すとペン側が持ち上がる</text><rect x="56.0" y="118.0" width="210.0" height="62.0" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.0"/><line x1="70.0" y1="138.0" x2="100.0" y2="138.0" stroke="#9aa5b1" stroke-width="6" stroke-linecap="round"/><text x="110.0" y="142.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="400">ペン下げ（描画中）</text><line x1="70.0" y1="162.0" x2="100.0" y2="162.0" stroke="#6a737d" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><text x="110.0" y="166.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="400">ペン上げ（移動中）</text><rect x="430.0" y="384.0" width="262.0" height="72.0" rx="6" fill="#f6f8fa" stroke="#6a737d" stroke-width="1.0"/><text x="444.0" y="406.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">penupdown() の角度</text><text x="444.0" y="426.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f2328" text-anchor="start" font-weight="400">10° = ペン上げ（起動時）　110° = ペン下げ</text><text x="444.0" y="444.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">1° ずつ 3 ms 間隔 → 昇降に約 300 ms</text></svg>
