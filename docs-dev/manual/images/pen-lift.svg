<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img"><title>ペン昇降機構</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9372c"/></marker></defs><rect width="720" height="470" fill="#ffffff"/><text x="24.0" y="34.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="18" fill="#1f2328" text-anchor="start" font-weight="700">ペン昇降機構（手順 ④⑤⑩）</text><text x="24.0" y="56.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="12" fill="#6a737d" text-anchor="start" font-weight="400">サーボは「持ち上げる」だけ。紙への押し付けはバネが担当する</text><text x="24.0" y="76.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">※ 模式図。バネの掛け位置は個体差があるため実機で確認すること</text><rect x="56.0" y="340.0" width="600.0" height="14.0" rx="3" fill="#3a3f45" stroke="#1f2328" stroke-width="1.4"/><rect x="80.0" y="336.0" width="210.0" height="5.0" rx="0" fill="#f4f4f2" stroke="#6a737d" stroke-width="1.0"/><text x="185.0" y="374.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">紙</text><text x="600.0" y="374.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11" fill="#6a737d" text-anchor="middle" font-weight="400">ベースプレート</text><line x1="372.0" y1="226.0" x2="165.0" y2="222.0" stroke="#6a737d" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 5"/><line x1="372.0" y1="226.0" x2="165.0" y2="258.0" stroke="#9aa5b1" stroke-width="10" stroke-linecap="round"/><line x1="372.0" y1="226.0" x2="165.0" y2="258.0" stroke="#d7dde5" stroke-width="6" stroke-linecap="round"/><line x1="372.0" y1="226.0" x2="436.0" y2="214.0" stroke="#9aa5b1" stroke-width="9" stroke-linecap="round"/><line x1="372.0" y1="226.0" x2="436.0" y2="214.0" stroke="#d7dde5" stroke-width="5" stroke-linecap="round"/><rect x="153.0" y="222.0" width="24.0" height="66.0" rx="3" fill="none" stroke="#6a737d" stroke-width="1.2" stroke-dasharray="5 4"/><polygon points="153.0,288.0 177.0,288.0 165.0,306.0" fill="none" stroke="#6a737d" stroke-width="1.2" stroke-linejoin="round"/><rect x="153.0" y="258.0" width="24.0" height="66.0" rx="3" fill="#e8b93a" stroke="#1f2328" stroke-width="1.5"/><polygon points="153.0,324.0 177.0,324.0 165.0,342.0" fill="#c98a2a" stroke="#1f2328" stroke-width="1.4" stroke-linejoin="round"/><circle cx="372.0" cy="226.0" r="8.0" fill="#ffffff" stroke="#1f2328" stroke-width="2.4"/><circle cx="372.0" cy="226.0" r="2.6" fill="#1f2328" stroke="none" stroke-width="0"/><path d="M402.0,140.0 L376.0,218.0" fill="none" stroke="#c9372c" stroke-width="1.3" marker-end="url(#ah)"/><text x="402.0" y="135.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="11.5" fill="#c9372c" text-anchor="start" font-weight="600">支点：M3×16 + M3×9 スペーサ</text><text x="402.0" y="156.0" font-family="system-ui,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif" font-size="10" fill="#6a737d" text-anchor="start" font-weight="400">軽く回る程度に締める（固いと動かない）</text><circle cx="262.0" cy="244.0" r="4.4" fill="none" stroke="#b08d57" stroke-width="1.6"/><path d="M262.0,248.0 L272.0,254.0 L252.0,263.0 L272.0,272.0 L252.0,281.0 L272.0,290.0 L252.0,299.0 L272.0,308.0 L252.0,317.0 L262.0,330" fill="none" stroke="#b08d57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="262.0" cy="334.0" r="4.4" fill="none" stroke="#b08d57" stroke-width="1.6"/><path 